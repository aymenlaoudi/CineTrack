<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>CineTrack</title>
</head>

<body class="flex flex-col bg-black">
    <section class="flex flex-col gap-18 w-4/4">
        <header class="flex">
            <div class="flex w-1/3">
                <img class="w-40" src="./img/logo.png" alt="logo">
            </div>
        </header>
        <aside class="fixed top-0 right-0 z-50 h-full w-72 overflow-y-auto bg-[#181818] p-4 text-white">
            <h2 class="text-xl mb-4">Favorites</h2>
            <div class="flex flex-col gap-2"></div>
        </aside>
        <main class="w-3/4">
            <section class="flex gap-4 p-4 border-white">
            <div class="flex w-2/3">
                <input id="search" type="text" class="bg-[#2b2b34] h-10 w-full rounded-sm text-center text-white"
                    placeholder="Search movies or series...">
            </div>
            <div class="flex w-1/3">
                <select id="filter" class="w-full bg-[#2b2b34] rounded-sm text-center text-white" name="filter" id="">
                    <option value="">-- Select your choise</option>
                    <option value="Tout">Tout</option>
                    <option value="Movies">Movies</option>
                    <option value="Series">Series</option>
                </select>
            </div>
            </section>
            <section id="modal_parent">
            <div id="modal-card" class="items-center fixed hidden inset-0 justify-center backdrop-blur-sm z-50">
                <div id="content-modal" class="w-[700px] max-w-[90%] min-h-[400px] bg-[#181818] text-white shadow-2xl rounded-lg p-6"></div>
            </div>
            </section>
            <section id="test" class="grid grid-cols-4 gap-4 mx-4 my-4">
            </section>
            <section id="pagination" class="flex justify-center gap-2 mb-20">
                <button type="button"class="w-10 h-10 border-1 rounded-xl bg-white hover:bg-blue-500">1</button>
                <button type="button" class="w-10 h-10 border-1 rounded-xl bg-white hover:bg-blue-500">2</button>
                <button type="button" class="w-10 h-10 border-1 rounded-xl bg-white hover:bg-blue-500">3</button>
                <button type="button" class="w-10 h-10 border-1 rounded-xl bg-white hover:bg-blue-500">4</button>
            </section>
        </main>
    </section>
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/api.js"></script>
</body>

</html>
